name: site-sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the live site
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          def get(path):
              req = urllib.request.Request(
                  "https://alphabet.is-a.dev" + path,
                  headers={"User-Agent": "site-sync/1"},
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          try:
              build = get("/api/build")
              stamp = get("/api/content-stamp")
          except Exception as error:
              print("site unreachable ({}); leaving README alone".format(error))
              raise SystemExit(0)

          build_id = str(build.get("id") or "000000")
          sha = str(build.get("sha") or "unknown")
          content = str(stamp.get("stamp") or "0")

          path = Path("profile/README.md")
          text = path.read_text()
          previous = re.search(r"<!-- home:\n(.*?)\n-->", text, flags=re.S)
          stored = previous.group(1) if previous else ""

          try:
              home = str(get("/api/home").get("home") or "")
          except Exception as error:
              print("home endpoint unavailable ({}); keeping stored text".format(error))
              home = stored

          safe = home.replace("-->", "-- >").strip()
          home_hash = hashlib.sha256(safe.encode()).hexdigest()[:7]
          asset = Path("profile/assets/sky-preview.webp")
          digest = hashlib.sha256(asset.read_bytes() + b"\0" + safe.encode()).hexdigest()[:7]
          version = build_id + "-" + digest

          line = (
              "<!-- live: › live from alphabet.is-a.dev · build `{}` · `{}` · content `{}` · home `{}` -->"
              .format(build_id, sha, content, home_hash)
          )
          text, hits = re.subn(
              r"^<!-- live: .*?-->$",
              line,
              text,
              count=1,
              flags=re.M,
          )
          assert hits == 1, "live line marker missing"

          block = "<!-- home:\n" + safe + "\n-->"
          text, hits = re.subn(
              r"<!-- home:.*?-->",
              lambda match: block,
              text,
              count=1,
              flags=re.S,
          )
          assert hits == 1, "home text marker missing"

          text, hits = re.subn(
              r"(sky-preview\.webp\?v=)[A-Za-z0-9-]+",
              lambda match: match.group(1) + version,
              text,
              count=1,
          )
          assert hits == 1, "image cache-buster missing"
          path.write_text(text)
          print("synced {} {} {} home {}".format(build_id, sha, content, home_hash))
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "already current"
            exit 0
          fi
          git config user.name "CallMeAlphabet"
          git config user.email "sigma.alphabet@proton.me"
          git add profile/README.md
          git commit -m "sync live build and home text from alphabet.is-a.dev"
          git push
